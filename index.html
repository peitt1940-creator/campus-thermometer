<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>校園溫度計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: start page = title + a real 0–100° campus thermometer + self-check question; play = full-screen top-down campus canvas under a slim HUD, events arrive as taped paper notes with a countdown; end = report keyed to final temperature */
:root{
  --bg:#e3e7e4; --sheet:#fbfaf6; --ink:#24292c; --muted:#5d6965; --line:#cbd3cf;
  --brick:#c8553d; --frost:#3f78a3; --leaf:#3c8457; --sun:#e2a131; --note:#fffbea; --plum:#8a5aa8; --sage:#5a8f7b;
  --f-display:"Huninn","LXGW WenKai TC","Kaiti TC","DFKai-SB",sans-serif;
  --f-hand:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.65}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--frost);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:28px 56px}

/* ---------- 開始畫面 ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--muted)}
.title{font-family:var(--f-display);font-size:clamp(42px,12vw,68px);line-height:1.05;margin-top:6px;letter-spacing:.02em}
.title span{color:var(--brick)}
.ask{font-family:var(--f-hand);font-size:21px;margin-top:12px}
.lede{color:var(--muted);margin-top:8px;max-width:30em}
.bigthermo{display:grid;grid-template-columns:auto auto;gap:0 8px;align-items:stretch;padding-top:8px}
.tube{position:relative;width:26px;height:230px;border:3px solid var(--ink);border-radius:13px 13px 0 0;border-bottom:none;background:var(--sheet);overflow:hidden}
.tube i{position:absolute;left:4px;right:4px;bottom:0;height:40%;border-radius:6px 6px 0 0;background:var(--brick);animation:rise 2.4s ease-in-out .3s both}
@keyframes rise{0%{height:8%}55%{height:80%}100%{height:40%}}
.bulb{grid-column:1;width:46px;height:46px;margin-left:-10px;margin-top:-4px;border:3px solid var(--ink);border-radius:50%;background:var(--brick)}
.ticks{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;justify-content:space-between;height:230px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.ticks span b{color:var(--ink);font-weight:500;margin-right:4px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:22px}
.how div{padding:10px 12px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;font-size:14px}
.how b{display:block;font-family:var(--f-display);font-size:16px;font-weight:400}
.cast{margin-top:22px}
.cast h3,.end h3,.selfq h3{font-size:12px;letter-spacing:.18em;color:var(--muted);font-weight:500}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.people span{font-size:13px;padding:2px 10px;border-radius:999px;background:var(--sheet);border:1px solid var(--line)}
.people i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.selfq{margin-top:26px;padding:16px;background:var(--note);border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 8px 20px -14px rgba(0,0,0,.5)}
.selfq p{font-family:var(--f-display);font-size:20px;margin:6px 0 0;line-height:1.4}
.selfq .opts{margin-top:12px}
.selfq small{display:block;margin-top:10px;color:var(--muted);font-size:12.5px}
.foot{margin-top:28px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
.foot label{margin-right:6px}
.foot select{padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);font-size:12px}
.credit{margin:10px 0 0;font-size:11.5px}
.teacher{margin-top:26px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
.teacher summary{cursor:pointer;color:var(--ink);font-weight:500}
.teacher ul{margin:8px 0 0;padding-left:1.3em}
.teacher label{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--ink)}
.teacher select{padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--sheet)}

/* ---------- 遊戲畫面 ---------- */
#game{position:fixed;inset:0;display:flex;flex-direction:column;background:#2d3833;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hud{background:#1f2724;color:#eef1ee;padding:8px 12px 8px;display:grid;gap:6px;flex:none;border-bottom:2px solid #11171a}
.hud-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timebox{min-width:0}
.ph{font-size:11.5px;opacity:.75;white-space:nowrap}
.clock{font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.thermo{flex:1;min-width:120px;display:flex;align-items:center;gap:8px}
.th-track{position:relative;flex:1;height:12px;border-radius:999px;background:linear-gradient(90deg,#4f86b3,#9bb9cf 35%,#f0c27a 62%,#d9573d);overflow:hidden;border:1.5px solid rgba(255,255,255,.35)}
.th-track i{position:absolute;top:0;right:0;bottom:0;background:#2a332f;transition:width .8s ease}
.th-num{font-family:var(--f-display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums;min-width:2.6em;text-align:right}
.th-lab{font-size:10.5px;opacity:.7;white-space:nowrap}
.hud-btns{display:flex;gap:5px}
.hud-btns button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#eef1ee;border-radius:4px;padding:2px 8px;font-size:12px}
.hud-btns button[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.flow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;font-size:11px;white-space:nowrap}
.flow::-webkit-scrollbar{display:none}
.flow span{padding:0 8px;border-radius:999px;border:1px solid rgba(255,255,255,.2);opacity:.6}
.flow span.done{opacity:.35;text-decoration:line-through}
.flow span.now{opacity:1;background:#f0c27a;color:#24292c;border-color:#f0c27a;font-weight:700}
.goal{font-size:12.5px;color:#f0c27a;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.goal .tk{font-size:11.5px;color:#eef1ee;padding:0 7px;border-radius:3px;border:1px solid rgba(255,255,255,.3)}
.goal .tk.ok{background:#3c8457;border-color:#3c8457;text-decoration:line-through}
.goal .tk.no{background:#5b6670;border-color:#5b6670;text-decoration:line-through;opacity:.7}
@media (max-width:460px){.thermo{flex:0 1 auto;min-width:0}.th-track{display:none}.th-lab{font-size:10.5px;white-space:normal;max-width:7em;line-height:1.25}}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#toast{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);max-width:calc(100% - 32px);background:rgba(18,24,22,.88);color:#f3f1e6;padding:7px 14px;border-radius:6px;font-size:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#toast.on{opacity:1}
#banner{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(.96);text-align:center;color:#fff;background:rgba(18,24,22,.86);padding:14px 26px;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .35s,transform .35s;max-width:calc(100% - 32px)}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;color:#f0c27a}
#banner span{display:block;font-size:15px;margin-top:2px}
.ctlhint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:#fff;background:rgba(0,0,0,.45);padding:4px 12px;border-radius:999px;pointer-events:none;white-space:nowrap;transition:opacity .6s}
#pauseMsg{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,14,12,.55);color:#fff;font-family:var(--f-display);font-size:30px;letter-spacing:.3em}
#shade{position:absolute;inset:0;background:rgba(10,14,12,.42)}
#modal{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;padding:0 12px 16px;overscroll-behavior:contain}

/* 紙條 */
.note{position:relative;max-width:560px;margin:22px auto 0;background:var(--note);border-radius:3px;padding:20px 18px 18px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 10px 24px -12px rgba(0,0,0,.5);
  background-image:linear-gradient(rgba(63,120,163,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(63,120,163,.09) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.tape{position:absolute;top:-12px;left:50%;width:96px;height:24px;margin-left:-48px;background:rgba(226,161,49,.5);transform:rotate(-2deg)}
.cd{height:6px;border-radius:999px;background:rgba(36,41,44,.12);overflow:hidden;margin-bottom:10px}
.cd i{display:block;height:100%;width:100%;background:var(--sun);transition:width .1s linear}
.cd.low i{background:var(--brick)}
.note-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.who{font-weight:700;color:var(--ink);padding:0 8px;border-radius:999px;border:1.5px solid currentColor}
.speak{margin-left:auto;background:transparent;border:1px solid var(--frost);color:var(--frost);border-radius:999px;padding:0 10px;font-size:12px}
.note h2{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.3;margin-top:10px}
.narr{font-family:var(--f-hand);font-size:18px;line-height:1.75;margin:6px 0 0;max-width:34em}
.opts{display:grid;gap:9px;margin-top:14px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.opt:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt .k{flex:none;width:25px;height:25px;border-radius:50%;border:1.5px solid var(--frost);color:var(--frost);font-weight:700;font-size:13px;display:grid;place-items:center}
.opt .t{min-width:0;font-size:15.5px;line-height:1.5;padding-top:1px}
.opt .t small{display:block;font-size:12.5px;color:var(--muted)}
.opt[disabled]{opacity:.35;box-shadow:none;cursor:default;transform:none}
.opt.picked{opacity:1;border-color:var(--frost);box-shadow:3px 3px 0 var(--frost)}
.res{margin-top:14px;padding-top:12px;border-top:2px dashed var(--line);display:grid;gap:10px}
.res .narr{margin:0}
.why{font-size:13px;color:var(--muted)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.delta{font-family:var(--f-display);font-size:16px;padding:2px 12px;border-radius:999px;color:#fff;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.delta.up{background:var(--brick)} .delta.down{background:var(--frost)} .delta.flat{background:var(--muted)} .delta.time{background:#5b6670}
@keyframes pop{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
.next{padding:12px;border:none;border-radius:6px;background:var(--ink);color:var(--sheet);font-weight:700;letter-spacing:.1em}
.tasks{display:grid;gap:4px;margin-top:10px;font-size:14px}
.tasks span{display:flex;gap:8px;align-items:baseline}
.tasks b{flex:none;width:1.4em;text-align:center}
.fade-in{animation:slide .3s ease both}
@keyframes slide{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- 結算 ---------- */
.end{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--tier-bg,var(--bg));color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.end.t4{--tier-bg:#f6e6d6} .end.t3{--tier-bg:#f1ead9} .end.t2{--tier-bg:#dfe4e6} .end.t1{--tier-bg:#d3dce4}
.deg{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:6px}
.deg b{font-family:var(--f-display);font-weight:400;font-size:clamp(64px,20vw,110px);line-height:1;font-variant-numeric:tabular-nums}
.end.t4 .deg b,.end.t3 .deg b{color:var(--brick)} .end.t2 .deg b,.end.t1 .deg b{color:var(--frost)}
.ending{font-family:var(--f-display);font-size:28px}
.tierline{font-family:var(--f-hand);font-size:19px;line-height:1.8;margin-top:10px;max-width:32em}
.sect{margin-top:28px;border-top:1px solid rgba(36,41,44,.18);padding-top:14px}
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.vs div{background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;padding:10px 12px}
.vs small{display:block;font-size:12px;color:var(--muted)}
.vs b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.4}
.vsnote{font-size:14px;margin:10px 0 0}
.log{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.log li{display:grid;grid-template-columns:3.2em 1fr auto;gap:8px;align-items:baseline;font-size:14px}
.log time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.log .c{min-width:0}
.log .c b{font-weight:500}
.log .c em{font-style:normal;color:var(--brick);font-size:12px;margin-left:4px}
.chip{font-size:12px;padding:0 8px;border-radius:999px;color:#fff;white-space:nowrap}
.chip.w{background:var(--brick)} .chip.p{background:var(--sun);color:#3a2a08} .chip.c{background:#7d8a92} .chip.h{background:var(--frost)} .chip.m{background:var(--plum)} .chip.o{background:var(--sage)} .chip.n{background:var(--leaf)}
.plain{margin:8px 0 0;padding-left:1.3em;font-size:14.5px}
.plain li{margin-bottom:4px}
.rel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.rel div{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
.rel b{display:block;font-size:15px}
.legend{display:grid;gap:8px;margin-top:10px;font-size:14px}
.legend div{display:grid;grid-template-columns:5.6em 1fr;gap:8px;align-items:baseline}
.bystander{margin-top:12px;font-size:14px;background:var(--sheet);border-left:4px solid var(--frost);padding:10px 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.row button{flex:1 1 150px;padding:13px;border-radius:7px;font-weight:700;letter-spacing:.06em}
.primary{background:var(--brick);color:#fff;border:none}
.ghost{background:transparent;border:1.5px solid var(--ink)}
.end details{margin-top:10px;font-size:14.5px}
.end summary{cursor:pointer;font-weight:500}
.end ol{margin:8px 0 0;padding-left:1.4em}
.end ol li{margin-bottom:6px}
@media (max-width:460px){.hero{grid-template-columns:1fr}.bigthermo{display:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="start" class="wrap"></div>

<div id="game" hidden>
  <header class="hud">
    <div class="hud-row">
      <div class="timebox"><div class="ph" id="phName">到校</div><div class="clock" id="clock">07:40</div></div>
      <div class="hud-btns"><button id="pauseBtn">暫停</button><button id="sndBtn" aria-pressed="true">聲音</button><button id="voBtn" aria-pressed="false" title="自動朗讀紙條內容">朗讀</button></div>
    </div>
    <div class="flow" id="flow"></div>
    <div class="goal" id="goal"></div>
  </header>
  <div id="stage">
    <canvas id="cv" aria-label="校園地圖"></canvas>
    <div id="toast"></div>
    <div id="banner"></div>
    <div class="ctlhint" id="ctlhint">拖曳畫面移動 · 鍵盤用方向鍵</div>
    <div id="pauseMsg" hidden>暫停中</div>
    <div id="shade" hidden></div>
    <div id="modal" hidden></div>
  </div>
</div>

<div id="end" class="end" hidden></div>

<script>
/* 校園溫度計 v2 */
/* ================= 人物 ================= */
const PPL={
  zhe:{n:'阿哲',r:'同班同學',c:'#e07a3b'},
  jiaen:{n:'小恩',r:'轉學生',c:'#3b8fb0'},
  yu:{n:'小魚',r:'同班同學',c:'#c99422'},
  mi:{n:'小米',r:'一年級學妹',c:'#e0668c'},
  dou:{n:'豆豆',r:'三年級學弟',c:'#4f9a52'},
  yx:{n:'宇翔',r:'六年級學長',c:'#4a5bb0'},
  py:{n:'品妍',r:'六年級學姊',c:'#9256b0'},
  lin:{n:'林老師',r:'導師',c:'#7a6450'},
  kai:{n:'阿凱',r:'四年級',c:'#6d7f88'},
  lele:{n:'樂樂',r:'二年級學弟',c:'#c2683a'}
};
/* 六種選擇 */
const TYPE={
  w:{n:'真心',d:6,tr:2,why:'看清楚對方需要什麼，願意花一點自己的時間或冒一點險。'},
  m:{n:'沒看清楚',d:0,tr:0,why:'想幫忙，但沒有先看清楚對方需要什麼，結果讓對方更不自在。'},
  o:{n:'剛好',d:0,tr:0,why:'看清楚狀況之後，選擇不打擾、或守住自己的界線，在那個情況下剛剛好。'},
  p:{n:'做表面',d:0,tr:0,why:'看起來友善，其實是為了被喜歡、有面子，或少一點麻煩。當下感覺不錯，事情常常沒有真的變好。'},
  c:{n:'路過',d:-4,tr:-1,why:'沒有傷害誰，只是沒有停下來。'},
  h:{n:'傷人',d:-6,tr:-2,why:'跟著大家一起笑、一起怪人，或用讓人難受的方式說話。'}
};
/* 自己的事 */
const TASKS={
  glue:{n:'去合作社買膠水',s:'膠水',due:'第一節下課（第三節分組要用）',at:'shop',ph:1,fail:'第三節分組課沒有膠水，海報只好用膠帶黏，貼歪了一角。'},
  form:{n:'把運動會報名表交到辦公室',s:'報名表',due:'第一節下課',at:'off',ph:1,fail:'報名表晚交了，大隊接力的名單裡沒有你。'},
  book:{n:'把《小王子》還到圖書室',s:'還書',due:'今天放學前',at:'lib',ph:-1,fail:'書逾期了，圖書室登記你這星期不能借書。'},
  go:{n:'把借來的圍棋還給六年級的宇翔學長',s:'圍棋',due:'今天放學前',at:'six',ph:-1,fail:'圍棋沒還，宇翔學長放學時在你們班門口等了 5 分鐘。'},
  yu:{n:'去籃球場找小魚，約放學一起去書店',s:'找小魚',due:'下午下課',at:'court',ph:5,fail:'小魚等不到你，跟別人去書店了。'}
};
/* ================= 事件卡 =================
   選項：[文字, 類型, 結果, {cost:分鐘, d, tr, f:旗標, by:旁觀者, v:{A:{...},B:{...}} 依線索不同而不同}]
   卡片 vars：同一個情境的兩種線索，{v} 會換成其中一種 */
function C(id,who,ti,tx,ops,vars){return {id,who,ti,tx,vars,ops:ops.map(o=>Object.assign({l:o[0],t:o[1],r:o[2]},o[3]||{}))}}
/* V：同一個做法，在兩種線索下結果不同。V(選項, [A類型, A結果, {A額外}], [B類型, B結果, {B額外}], {共同設定}) */
function V(l,a,b,ex){return [l,'',' ',Object.assign({v:{A:Object.assign({t:a[0],r:a[1]},a[2]||{}),B:Object.assign({t:b[0],r:b[1]},b[2]||{})}},ex||{})]}

const AU=(()=>{
  let ctx=null,master,music,sfx,timer=null,step=0,nextT=0,on=true,warm=.5;
  try{on=localStorage.getItem('wd_snd')!=='0'}catch(e){}
  const mf=m=>440*Math.pow(2,(m-69)/12);
  // 原創旋律，C 大調；校園變冷時改成小調、放慢
  const MEL=[60,64,67,72,71,67,64,67, 65,69,72,69,67,64,62,0, 60,64,67,69,67,64,65,64, 62,65,69,67,65,64,62,0,
             64,67,72,71,69,67,69,71, 72,71,69,67,65,64,62,64, 65,64,62,60,62,64,67,64, 62,59,62,64,60,0,0,0];
  const BASS=[48,45,41,43,48,45,41,43];
  const toMinor=m=>{const pc=m%12;return (pc===4||pc===9||pc===11)?m-1:m};
  function init(){
    if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();
      master=ctx.createGain();master.gain.value=on?1:0;master.connect(ctx.destination);
      music=ctx.createGain();music.gain.value=.45;music.connect(master);sfx=ctx.createGain();sfx.gain.value=.9;sfx.connect(master)}
    if(ctx.state==='suspended')ctx.resume();
  }
  function tone(f,t,d,type,vol,dest,att){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(dest||sfx);o.start(t);o.stop(t+d+.05)}
  function noise(t,d,vol,f1,f2){const len=Math.max(1,Math.floor(ctx.sampleRate*d)),b=ctx.createBuffer(1,len,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=Math.random()*2-1;
    const s=ctx.createBufferSource();s.buffer=b;const fl=ctx.createBiquadFilter();fl.type='bandpass';fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(sfx);s.start(t);s.stop(t+d)}
  function sched(){if(!ctx)return;const tempo=86+warm*36,e=60/tempo/2,minor=warm<.4;
    while(nextT<ctx.currentTime+.15){const i=step%MEL.length;let m=MEL[i];
      if(m){if(minor)m=toMinor(m);tone(mf(m),nextT,e*.9,warm<.4?'sine':'triangle',.07,music)}
      if(i%2===0){let bm=BASS[Math.floor(i/8)%BASS.length]+(i%4===2?7:0);if(minor)bm=toMinor(bm);tone(mf(bm),nextT,e*1.8,'sine',.12,music)}
      if(warm>=.4&&i%4===2)noise(nextT,.04,.04,6000,8000);
      nextT+=e;step++}}
  function bgmStart(){if(!ctx)return;bgmStop();step=0;nextT=ctx.currentTime+.6;timer=setInterval(sched,30)}
  function bgmStop(){if(timer){clearInterval(timer);timer=null}}
  function setWarm(v){warm=v}
  function duck(v){if(!ctx)return;music.gain.setTargetAtTime(v?.15:.45,ctx.currentTime,.15)}
  function bell(){if(!ctx)return;const N=[64,60,62,55, 55,62,64,60],t0=ctx.currentTime+.05;
    N.forEach((m,i)=>{const t=t0+i*.45+(i>=4?.3:0),f=mf(m+12);tone(f,t,1.4,'sine',.14,sfx,.005);tone(f*2.01,t,.7,'sine',.04,sfx,.005)})}
  function up(){if(!ctx)return;const t=ctx.currentTime+.02;[72,76,79,84].forEach((m,i)=>tone(mf(m),t+i*.08,.5,'sine',.12))}
  function down(){if(!ctx)return;const t=ctx.currentTime+.02;[67,63,60].forEach((m,i)=>tone(mf(m-12),t+i*.14,.7,'sine',.14))}
  function rustle(){if(!ctx)return;noise(ctx.currentTime,.25,.25,900,2600)}
  function click(){if(!ctx)return;noise(ctx.currentTime,.05,.12,2500,1500)}
  function tick(){if(!ctx)return;tone(1600,ctx.currentTime,.05,'square',.03)}
  function ding(){if(!ctx)return;const t=ctx.currentTime;tone(mf(84),t,.4,'sine',.1);tone(mf(91),t+.08,.5,'sine',.08)}
  function ending(v){if(!ctx)return;const t=ctx.currentTime+.05,seq=v>=.5?[72,76,79,84]:[69,72,76,69];seq.forEach((m,i)=>tone(mf(v>=.5?m:toMinor(m)),t+i*.2,i===3?1.4:.4,'triangle',.1))}
  function setOn(v){on=v;try{localStorage.setItem('wd_snd',v?'1':'0')}catch(e){}if(master&&ctx)master.gain.setTargetAtTime(v?1:0,ctx.currentTime,.05)}
  function pause(v){if(!ctx)return;v?ctx.suspend():ctx.resume()}
  return {init,bgmStart,bgmStop,setWarm,duck,bell,up,down,rustle,click,tick,ding,ending,setOn,pause,get on(){return on}};
})();
const VO=(()=>{
  const ok=typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
  let voice=null,auto=false;
  try{auto=localStorage.getItem('wd_vo')==='1'}catch(e){}
  function pickVoice(){if(!ok)return;const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh/i.test(v.lang))||null}
  if(ok){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}}
  function speak(text){if(!ok)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=voice?voice.lang:'zh-TW';if(voice)u.voice=voice;u.rate=1;speechSynthesis.speak(u)}catch(e){}}
  function stop(){if(ok)try{speechSynthesis.cancel()}catch(e){}}
  function setAuto(v){auto=v;try{localStorage.setItem('wd_vo',v?'1':'0')}catch(e){}if(!v)stop()}
  return {ok,speak,stop,setAuto,get auto(){return auto}};
})();

let grid=[];
function fillG(x,y,w,h,v){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)grid[j][i]=v}
function buildWorld(){
  grid=Array.from({length:MH},()=>Array(MW).fill(0));
  for(let x=0;x<MW;x++){grid[0][x]=1;grid[MH-1][x]=1}
  for(let y=0;y<MH;y++){grid[y][0]=1;grid[y][MW-1]=1}
  fillG(FIELD.x,FIELD.y,FIELD.w,FIELD.h,2);fillG(GARDEN.x,GARDEN.y,GARDEN.w,GARDEN.h,2);fillG(COURT.x,COURT.y,COURT.w,COURT.h,6);
  ROOMS.forEach(r=>{fillG(r.x,r.y,r.w,r.h,1);grid[r.dy][r.dx]=3});
  TREES.forEach(([x,y])=>grid[y][x]=4);
}
function walkable(x,y){const tx=Math.floor(x),ty=Math.floor(y);if(tx<0||ty<0||tx>=MW||ty>=MH)return false;const c=grid[ty][tx];return c===0||c===2||c===6}
function blocked(x,y,r){return !walkable(x-r,y-r)||!walkable(x+r,y-r)||!walkable(x-r,y+r)||!walkable(x+r,y+r)}
function moveEnt(e,dx,dy,r){const ox=e.x,oy=e.y;if(!blocked(e.x+dx,e.y,r))e.x+=dx;if(!blocked(e.x,e.y+dy,r))e.y+=dy;return Math.hypot(e.x-ox,e.y-oy)}
function randTile(near,rad){for(let k=0;k<60;k++){const x=near?clamp(Math.floor(near.x)+rint(-rad,rad),1,MW-2):rint(1,MW-2);const y=near?clamp(Math.floor(near.y)+rint(-rad,rad),1,MH-2):rint(1,MH-2);if(walkable(x+.5,y+.5))return {x:x+.5,y:y+.5}}return {x:16,y:6}}

/* ================= 每一格的更新 ================= */
function updNPC(n,dt){
  const lead=S.temp>=65&&n.idx%2===1?NPCS[n.idx-1]:null;
  if(n.goto){n.tgt={x:n.goto.x+.6,y:n.goto.y+.2}}
  else if(lead){n.tgt={x:lead.x+.7,y:lead.y+.2}}
  else if(!n.tgt||Math.hypot(n.tgt.x-n.x,n.tgt.y-n.y)<.3)n.tgt=randTile(n,7);
  const dx=n.tgt.x-n.x,dy=n.tgt.y-n.y,L=Math.hypot(dx,dy)||1;
  const spd=n.spd*(S.temp<35?1.25:1)*(lead&&L<.9?.2:1)*(n.goto?1.6:1),s=spd*dt;
  const m=moveEnt(n,dx/L*s,dy/L*s,.28);n.walk+=m*3;n.moving=m>.001;if(L>.05){n.fx=dx/L;n.fy=dy/L}
  if(m<s*.3&&L>.5){n.stuck+=dt;if(n.stuck>.6){if(!n.goto)n.tgt=randTile(n,4);else{n.x+=(R()-.5)*.4}n.stuck=0}}else n.stuck=0;
  if(n.bub>0)n.bub-=dt;else if(S.temp<40&&R()<dt*.08)n.bub=1.6;
  if(S.temp>=65&&lead&&R()<dt*.05)S.fx.push({x:(n.x+lead.x)/2,y:(n.y+lead.y)/2-.6,life:1.4});
  if(n.goto&&Math.hypot(n.x-n.goto.x,n.y-n.goto.y)<1){const g=n.goto;n.goto=null;for(let k=0;k<4;k++)S.fx.push({x:g.x+(R()-.5),y:g.y-.4-R()*.4,life:1.2+R()*.6})}
}
function update(dt){
  let ix=0,iy=0;
  if(keys.arrowleft||keys.a)ix-=1;if(keys.arrowright||keys.d)ix+=1;if(keys.arrowup||keys.w)iy-=1;if(keys.arrowdown||keys.s)iy+=1;
  if(joy){const jx=(joy.x-joy.ox)/42,jy=(joy.y-joy.oy)/42,L=Math.hypot(jx,jy);if(L>.15){ix=jx/Math.max(1,L);iy=jy/Math.max(1,L)}}
  const L=Math.hypot(ix,iy);P.moving=L>.1;
  if(P.moving){const nx=ix/Math.max(1,L),ny=iy/Math.max(1,L),h=Math.hypot(nx,ny)||1;P.fx=nx/h;P.fy=ny/h;walkT+=moveEnt(P,nx*4.2*dt,ny*4.2*dt,.3);
    if(!hintShown){hintShown=1;$('ctlhint').style.opacity=0}}
  NPCS.forEach(n=>updNPC(n,dt));
  S.fx.forEach(f=>{f.life-=dt;f.y-=dt*.6});S.fx=S.fx.filter(f=>f.life>0);
  if(S.enc&&S.enc.heart>0)S.enc.heart-=dt;
  const ph=PHASES[S.ph];S.phT+=dt;
  if(ph.free){
    S.tm=Math.min(ph.end,S.tm+dt*MIN_PER_SEC);const nt=Math.floor(S.tm);if(nt!==S.t){S.t=nt;hud()}
    grace-=dt;if(grace>0)return;
    if(S.tm>=ph.end){toast(`上課鐘響了。${S.ph===1&&S.task.glue===0?'膠水還沒買。':''}`);return nextPhase()}
    if(S.enc&&S.enc.state==='open'){S.enc.t-=dt;if(S.enc.t<=0||Math.hypot(S.enc.x-P.x,S.enc.y-P.y)<1){S.enc.state='talk';const e=S.enc;return openCard(CARDS[e.id],`下課・往${PLACE[S.dest]}的路上`,()=>{},e)}return}
    if(S.leg&&!S.leg.enc&&S.route.length&&Math.hypot(P.x-S.leg.sx,P.y-S.leg.sy)>3.5){S.leg.enc=true;spawnEncounter();return}
    if(S.dest&&!S.arrived&&atDest())return arriveFree();
    return;
  }
  const lim=ph.lim;
  const nt=Math.min(ph.end,ph.t+Math.floor(Math.min(1,S.phT/lim)*(ph.end-ph.t)));if(nt!==S.t){S.t=nt;hud()}
  grace-=dt;if(grace>0)return;
  if(!S.arrived&&atDest())return arrive();
  if(!S.arrived&&S.phT>=ph.lim){toast('上課鐘響了，你趕快跑過去。');const d=destPoint();
    if(S.dest==='fld'||S.dest==='gate'){P.x=d.x;P.y=d.y}else{const r=roomById(S.dest);P.x=r.dx+.5;P.y=r.dy+.5+r.out*1.3}
    return arrive()}
}

  const grid=[[0,'結冰'],[25,'陰天'],[50,'有陽光'],[75,'暖洋洋'],[100,'']].map(([v,lab])=>`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#24292c" stroke-opacity=".12"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="16" fill="#5d6965">${v}°</text>${lab?`<text x="${L+4}" y="${Y(v)-4}" font-size="14" fill="#5d6965">${lab}</text>`:''}`).join('');
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.temp).toFixed(1)}`).join('');
  const dots=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.temp).toFixed(1)}" r="${i===0||i===n-1?5:3.6}" fill="${col[p.ty]||'#24292c'}" stroke="#fbfaf6" stroke-width="1.5"><title>${esc(p.ti)}：${p.temp}°</title></circle>`).join('');
  return `<div style="overflow-x:auto;margin-top:10px"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:340px;height:auto;display:block" role="img" aria-label="校園溫度從早上 40 度變成 ${S.temp} 度">${grid}<path d="${line}" fill="none" stroke="#24292c" stroke-width="2"/>${dots}<text x="${L}" y="${H-8}" font-size="16" fill="#5d6965">早上 07:40</text><text x="${W-Rr}" y="${H-8}" font-size="16" fill="#5d6965" text-anchor="end">放學</text></svg></div>`;
}
const dlab=d=>d>0?`+${d}°`:d<0?`−${-d}°`:'±0°';
function relWord(v){return v>=4?'很信任你':v>=2?'覺得你人不錯':v>=0?'跟你還不熟':v>=-2?'有點受傷':'很受傷'}
function renderEnd(){
  if(S.over)return;S.over=true;running=false;stopCd();AU.bgmStop();AU.ending(S.temp/100);VO.stop();
  $('game').hidden=true;const o=$('end');const tier=TIERS.find(t=>S.temp>=t.min);o.className='end '+tier.c;o.hidden=false;
  const cnt={w:0,m:0,o:0,p:0,c:0,h:0};S.log.forEach(l=>cnt[l.ty]++);
  const judged=S.log.filter(l=>l.ty!=='o'),stopped=judged.filter(l=>l.ty==='w'||l.ty==='m').length,rate=judged.length?stopped/judged.length:0;
  const actual=rate>=.7?'大多數時候都停下來了':rate>=.4?'大約一半的時候停下來':'大多數時候沒有停下來';
  const notes=[];
  notes.push(`需要做決定的 ${judged.length} 次裡，你停下來 ${stopped} 次。`);
  if(S.by)notes.push(`有 ${S.by} 次，你覺得「應該有別人會處理」。`);
  if(S.timeouts)notes.push(`有 ${S.timeouts} 次，你還在想，時間就到了。`);
  if(cnt.m)notes.push(`有 ${cnt.m} 次你想幫忙，但沒先看清楚對方需要什麼。`);
  const met=[...S.met];
  o.innerHTML=`<div class="wrap">
    <div class="eyebrow">第 ${S.day} 天・16:20 放學</div>
    <div class="deg"><b>${S.temp}°</b><span class="ending">${tier.n}</span></div>
    <p class="tierline">${esc(tier.d)}</p>
    <div class="sect"><h3>今天的溫度變化</h3>
      <p class="vsnote">早上走進校門時是 40°。你每做一個選擇，溫度都在悄悄改變，放學時是 ${S.temp}°。圖上每一個點是一張紙條，點的顏色是那次選擇的種類。</p>
      ${tempChart()}</div>
    <div class="sect"><h3>你說的，和你做的</h3>
      <div class="vs"><div><small>開始前，你說你通常會</small><b>${esc(SELF[S.self])}</b></div><div><small>今天，你實際上</small><b>${actual}</b></div></div>
      <p class="vsnote">${notes.map(esc).join('<br>')}</p></div>
    <div class="sect"><h3>你自己的事</h3>
      <ul class="log">${Object.entries(TASKS).map(([k,t])=>`<li><time></time><span class="c"><b>${esc(t.n)}</b>${S.task[k]===1?'':`<br><span style="color:var(--muted)">${esc(t.fail)}</span>`}</span><span class="chip ${S.task[k]===1?'n':'c'}">${S.task[k]===1?'做完了':'沒做完'}</span></li>`).join('')}</ul>
      <p class="vsnote">今天下課，你花了 ${S.helpMin} 分鐘在別人身上。</p></div>
    <div class="sect"><h3>今天的每一張紙條</h3>
      <ul class="log">${S.log.map(l=>`<li><time>${fmt(l.t)}</time><span class="c"><b>${esc(l.ti)}</b>：${esc(l.l)}${l.to?'<em>時間到</em>':''}${l.env?`<em style="color:var(--muted)">（${ENV_LAB[l.env]}）</em>`:''}</span><span class="chip ${l.ty}">${TYPE[l.ty].n} ${dlab(l.d)}</span></li>`).join('')}</ul></div>
    <div class="sect"><h3>換你需要幫忙的時候</h3>
      <ul class="log">${S.needs.map(n=>`<li><time></time><span class="c"><b>${esc(n.ti)}</b>：${esc(n.body)}</span><span class="chip ${n.ok?'n':'c'}">${n.ok?'有人來':'沒有人'} ${dlab(n.d)}</span></li>`).join('')}</ul></div>
    ${S.others.length?`<div class="sect"><h3>你走過去之後</h3><ul class="plain">${S.others.map(m=>`<li>有同學停下來陪${esc(PPL[m.who].r)}${esc(PPL[m.who].n)}（${esc(m.ti)}）</li>`).join('')}</ul></div>`:''}
    <div class="sect"><h3>他們現在對你的感覺</h3>
      <div class="rel">${met.map(k=>`<div><b style="color:${PPL[k].c}">${esc(PPL[k].n)}</b>${esc(PPL[k].r)}・${relWord(trust(k))}</div>`).join('')}</div></div>
    <div class="sect"><h3>六種選擇</h3><div class="legend">
      ${['w','m','o','p','c','h'].map(k=>`<div><span class="chip ${k}" style="justify-self:start">${TYPE[k].n}</span><span>${esc(TYPE[k].why)}</span></div>`).join('')}</div>
      <div class="bystander" style="border-left-color:var(--brick)"><b>同一個選擇，在不同溫度的校園，效果不一樣</b><br>校園暖的時候，你的善意比較容易被別人學起來，你沒停下來時也常有人補上；校園冷的時候，善意比較容易被懷疑，你走過去也不會有人補上。所以暖的地方會越來越暖，冷的地方會越來越冷。</div>
      <div class="bystander"><b>旁觀者效應</b><br>旁邊的人越多，每個人越覺得「應該有別人會處理」。1968 年，心理學家 Darley 和 Latané 讓受試者透過對講機聽到有人發病：以為只有自己聽到時，85% 的人在對方發病期間就去求助；以為還有 4 個人也聽到時，只剩 31%。</div></div>
    <div class="sect"><h3>想一想</h3><details><summary>課後討論題（4 題）</summary><ol>${QUESTIONS.map(q=>`<li>${esc(q.replace('{self}',SELF[S.self]))}</li>`).join('')}</ol></details></div>
    <p class="tierline">明天的校園會是幾度，你覺得由誰決定呢？</p>
    <div class="row"><button class="primary" id="again">再過一天</button><button class="ghost" id="home">回到開始</button></div>
    <p class="credit" style="color:var(--muted);margin-top:22px">遊戲背景改編自辛巴王《今天也要平安下班》</p>
  </div>`;
  $('again').onclick=()=>{newRun(S.day+1,S.self);startGame()};
  $('home').onclick=()=>renderStart();
  o.scrollTop=0;
}
function setUserPause(v){userPaused=v;AU.pause(v);if(v)VO.stop();if($('modal').hidden)paused=v;$('pauseMsg').hidden=!v;$('pauseBtn').textContent=v?'繼續':'暫停'}

/* ================= 輸入 ================= */
function bindInput(){
  const cv=$('cv');
  cv.addEventListener('pointerdown',e=>{if(paused)return;try{cv.setPointerCapture(e.pointerId)}catch(_){}const r=cv.getBoundingClientRect();joy={id:e.pointerId,ox:e.clientX-r.left,oy:e.clientY-r.top,x:e.clientX-r.left,y:e.clientY-r.top}});
  cv.addEventListener('pointermove',e=>{if(!joy||e.pointerId!==joy.id)return;const r=cv.getBoundingClientRect();joy.x=e.clientX-r.left;joy.y=e.clientY-r.top});
  const end=e=>{if(joy&&e.pointerId===joy.id)joy=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  const K=['arrowleft','arrowright','arrowup','arrowdown','a','d','w','s'];
  addEventListener('keydown',e=>{if($('game').hidden)return;const k=e.key.toLowerCase();
    if(!$('modal').hidden){if(modalKeys)modalKeys(e);return}
    if(K.includes(k)){keys[k]=true;e.preventDefault()}
    if(k==='p'||k==='escape')setUserPause(!userPaused)});
  addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
  addEventListener('blur',()=>{keys={};joy=null});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&!$('game').hidden&&!userPaused)setUserPause(true)});
  $('pauseBtn').onclick=()=>setUserPause(!userPaused);
  $('sndBtn').onclick=()=>{AU.init();AU.setOn(!AU.on);syncAudioBtns()};
  $('voBtn').onclick=()=>{VO.setAuto(!VO.auto);syncAudioBtns()};
  if(window.ResizeObserver)new ResizeObserver(resize).observe($('stage'));else addEventListener('resize',resize);
}
if(typeof document!=='undefined'&&document.getElementById('start')){
  buildWorld();rebuildStatic();bindInput();renderStart();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(rebuildStatic);
}
</script>
